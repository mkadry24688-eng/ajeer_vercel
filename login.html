<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="tgrOam_fdJ4f6TJtcs_qrH7HjLSmtsAJuThxOKz3T48" />
  <title>تسجيل الدخول - نظام أمانة الرياض</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/shared/css/login.css" />
</head>

<body>

  <div class="bg-decorations">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>بوابة الخدمات الموحدة</h3>
        <p>سجل دخولك للوصول إلى أنظمة أمانة الرياض</p>
      </div>

      <form id="loginForm" action="/login" method="POST">
        <!-- ERROR_ALERT -->
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <div class="input-group">
            <input type="text" class="form-control" id="username" name="username" placeholder="اسم المستخدم" required />
            <span class="input-group-text"><i class="bi bi-person"></i></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
            <span class="input-group-text"><i class="bi bi-key"></i></span>
          </div>
        </div>

        <button type="submit" class="btn-login">
          تسجيل الدخول <i class="bi bi-box-arrow-in-left"></i>
        </button>
      </form>

      <div class="text-center mt-3">
      </div>

      <div class="mt-4 pt-3 border-top text-center">
        <small class="text-muted">نظام أمانة منطقة الرياض &copy; 2025</small>
      </div>
    </div>
  </div>
  </div>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/mongo-client.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/shared/js/login.js"></script>
</body>

</html>
