<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مسح الباركود - أجير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/shared/css/scanner.css" />
  </head>

  <body>
    <div class="scanner-container">
      <div class="scanner-header">
        <div class="scanner-icon">
          <i class="bi bi-qr-code-scan"></i>
        </div>
        <h1 class="scanner-title">مسح الباركود</h1>
        <p class="scanner-subtitle">
          قم بتوجيه الكاميرا نحو الباركود للتحقق من العقد
        </p>
      </div>

      <div class="instruction">
        <div class="camera-icon">
          <i class="bi bi-camera-fill"></i>
        </div>
        <p>
          وجه الكاميرا نحو رمز الاستجابة السريعة (QR Code) للتحقق من صحة العقد
        </p>
      </div>

      <div id="reader"></div>

      <div id="statusBox" class="status-box"></div>

      <a href="/ajeer" class="back-btn">
        <i class="bi bi-arrow-right"></i>
        العودة للصفحة الرئيسية
      </a>

      <div class="footer-logo">
        <img src="/shared/img/logo_ajeer_new.png" alt="Ajeer Logo" />
      </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="/shared/js/scanner.js"></script>
  </body>
</html>
